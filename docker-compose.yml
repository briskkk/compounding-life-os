# 便捷启动（非必需，根 Dockerfile 可独立运行）
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # 行情源优先级链（可用 simulated 覆盖回模拟源）
      MARKET_PROVIDER: ${MARKET_PROVIDER:-tencent,eastmoney-fund,sina}
      # 域名已备案并启用 HTTPS(certbot)：登录会话 cookie 的 Secure 属性自动为 true，
      # 故不再设置 DISABLE_SECURE_COOKIE（之前纯 HTTP 下为兼容而临时关闭）。
    volumes:
      - fwos-data:/app/prisma
    restart: unless-stopped

volumes:
  fwos-data:
