# ============================================================
# Nginx 反向代理配置 — Family Wealth OS
# 放到服务器: /etc/nginx/conf.d/family-wealth-os.conf
# 使用前替换:
#   - wealth.yourdomain.com  -> 你的域名
#   - /etc/nginx/ssl/...      -> 你的证书路径
# ============================================================

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name wealth.yourdomain.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    server_name wealth.yourdomain.com;

    # --- SSL 证书 ---
    # 腾讯云免费证书 (下载 Nginx 格式后上传到 /etc/nginx/ssl/)
    ssl_certificate     /etc/nginx/ssl/wealth.yourdomain.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/wealth.yourdomain.com.key;
    # 若用 Let's Encrypt (certbot --nginx -d wealth.yourdomain.com), 上面两行会被自动替换

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传文件大小 (导入 CSV 等)
    client_max_body_size 10m;

    # 代理到 Docker 容器内的 Next.js (端口 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Next.js 静态资源缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
