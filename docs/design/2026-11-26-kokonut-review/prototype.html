#compound-life-review{--cl-bg:#fafafa;--cl-surface:#fff;--cl-ink:#18181b;--cl-muted:#66666f;--cl-line:#e5e5e9;--cl-soft:#f4f4f5;--cl-up:#b42336;--cl-down:#157348;--cl-warn:#8a4b08;--cl-warn-bg:#fff5df;--cl-focus:#2457bd;--cl-font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue','Noto Sans',Arial,sans-serif;color:var(--cl-ink);font:14px/1.55 var(--cl-font);color-scheme:light;text-align:left;position:relative;isolation:isolate}
#compound-life-review[data-theme=dark]{--cl-bg:#131416;--cl-surface:#1b1c20;--cl-ink:#f4f4f5;--cl-muted:#b4b4be;--cl-line:#36383f;--cl-soft:#25272c;--cl-up:#ff9aa8;--cl-down:#79d4aa;--cl-warn:#f4c274;--cl-warn-bg:#382b18;--cl-focus:#92b8ff;color-scheme:dark}
#compound-life-review *{box-sizing:border-box}
#compound-life-review [hidden]{display:none!important}
#compound-life-review button,#compound-life-review input,#compound-life-review select,#compound-life-review textarea{font:inherit;color:inherit}
#compound-life-review button{cursor:default}
#compound-life-review button:focus-visible,#compound-life-review input:focus-visible,#compound-life-review select:focus-visible,#compound-life-review textarea:focus-visible{outline:2px solid var(--cl-focus);outline-offset:3px}
#compound-life-review h1,#compound-life-review h2,#compound-life-review h3,#compound-life-review p{margin:0}
#compound-life-review h1{font-size:24px;font-weight:500;letter-spacing:-.025em;line-height:1.4}
#compound-life-review h2{font-size:16px;font-weight:500;letter-spacing:-.01em}
#compound-life-review h3{font-size:14px;font-weight:500}
#compound-life-review b,#compound-life-review strong{font-weight:500}
#compound-life-review a{color:var(--cl-focus)}
#compound-life-review .cl-muted{color:var(--cl-muted)}
#compound-life-review .cl-small{font-size:12px}
#compound-life-review .cl-number{font-variant-numeric:tabular-nums;font-feature-settings:'tnum';white-space:nowrap;letter-spacing:-.015em}
#compound-life-review .cl-up{color:var(--cl-up)}
#compound-life-review .cl-down{color:var(--cl-down)}
#compound-life-review .cl-reviewbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--cl-soft);border-bottom:1px solid var(--cl-line)}
#compound-life-review .cl-reviewbar>span{font-size:12px;color:var(--cl-muted)}
#compound-life-review .cl-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#compound-life-review .cl-button{border:1px solid var(--cl-line);border-radius:6px;background:var(--cl-surface);padding:7px 12px;line-height:1.4;white-space:nowrap;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--cl-ink)}
#compound-life-review .cl-button:hover{background:var(--cl-soft)}
#compound-life-review .cl-primary{background:var(--cl-ink);color:var(--cl-surface);border-color:var(--cl-ink)}

  function chart(kind='wealth'){
    const daily=kind==='daily', values=daily?[0,210,-140,430,360,720,520,1120,950,1286.32]:[396,393,399,405,401,409,411,405,402,413,416,420,426,423,428]
    const yMax=daily?1500:440,yMin=daily?-500:380,w=620,h=230,left=42,right=18,top=15,bottom=35
    const X=i=>left+i*(w-left-right)/(values.length-1),Y=v=>top+(yMax-v)/(yMax-yMin)*(h-top-bottom)
    const ticks=daily?[-500,0,500,1000,1500]:[380,400,420,440]
    const labels=daily?['09:30','10:30','11:30','13:30','15:00']:['6月','7月','8月','9月','10月','11月']
    return `<svg class="cl-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${daily?'演示当日盈亏分时曲线，非真实行情':'演示净资产轨迹，单位万元，末值428万元'}">${ticks.map(v=>`<line class="cl-grid" x1="${left}" y1="${Y(v)}" x2="${w-right}" y2="${Y(v)}"/><text x="${left-9}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('')}<polyline class="cl-curve" points="${values.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}"/>${values.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="transparent"><title>${daily?'当日盈亏 '+money(v,true):'净资产 '+v+'万元'}</title></circle>`).join('')}<circle cx="${X(values.length-1)}" cy="${Y(values.at(-1))}" r="3" fill="var(--cl-ink)"/>${labels.map((label,i)=>`<text x="${left+i*(w-left-right)/(labels.length-1)}" y="${h-8}" text-anchor="${i===0?'start':i===labels.length-1?'end':'middle'}">${label}</text>`).join('')}</svg>`
  }

  function overview(){return `${heading('总览')}<section class="cl-summary" aria-label="家庭财富概况"><div><span class="cl-label">净资产 <button class="cl-help" data-info="networth" aria-label="了解净资产">i</button></span><div class="cl-value cl-number">${money(4280000)}</div><small class="cl-muted cl-small">总资产减负债</small></div><div><span class="cl-label">可投资资产 <button class="cl-help" data-info="investable" aria-label="了解可投资资产">i</button></span><div class="cl-value cl-number">${money(1860000)}</div><small class="cl-muted cl-small">含在途 ${money(8000)}</small></div><div><span class="cl-label">负债</span><div class="cl-value cl-number">${money(720000)}</div><button class="cl-textbutton cl-small" data-action="liabilities">查看明细 ›</button></div></section><div class="cl-evidence"><button class="cl-textbutton" data-action="health"><span class="cl-badge cl-warning">可投资资产估值覆盖 98.6% · 1项待更新</span></button><span>估值截至 11.26</span></div>${performance()}<div class="cl-support"><section class="cl-panel"><div class="cl-sectionhead"><h2>净资产走势</h2><small>近6个月 · 万元</small></div>${chart()}</section><section class="cl-panel"><div class="cl-sectionhead"><h2>待核对</h2><small>6项</small></div>${taskList()}<div class="cl-foot"><button class="cl-textbutton" data-page="review">进入本月复盘 ›</button></div></section></div>`}
  function assetRows(){let rows=holdings.filter(h=>(state.assetClass==='全部'||h.cls===state.assetClass)&&(`${h.name} ${h.symbol} ${h.account}`).toLowerCase().includes(state.assetSearch.toLowerCase()));return rows.sort((a,b)=>state.sortDir*(state.sort==='name'?a.name.localeCompare(b.name,'zh-CN'):a.value-b.value))}

  function assets(){return `${heading('资产')}<div class="cl-domaintabs" aria-label="资产视图">${[['holdings','持仓明细'],['composition','资产配置'],['accounts','账户与负债']].map(([key,name])=>`<button data-asset-view="${key}" aria-pressed="${state.assetView===key}">${name}</button>`).join('')}</div>${state.assetView==='holdings'?`<div class="cl-metrics"><div><span class="cl-label">持仓总市值 <button class="cl-help" data-info="holdings" aria-label="了解持仓总市值">i</button></span><div class="cl-metricvalue cl-number">${money(4992000)}</div><small class="cl-muted cl-small">含房产 · 不含在途</small></div><div><span class="cl-label">可投资资产</span><div class="cl-metricvalue cl-number">${money(1860000)}</div><small class="cl-muted cl-small">含在途 ${money(8000)}</small></div><div><span class="cl-label">未实现盈亏</span><div class="cl-metricvalue cl-number cl-up">${money(157000,true)}</div><small class="cl-muted cl-small">持仓市值减剩余成本</small></div></div><div class="cl-toolbar"><div class="cl-actions"><label><span class="cl-small cl-muted">类型 </span><select id="cl-asset-class" class="cl-field" aria-label="资产类型">${['全部','股票','基金','ETF','现金','黄金','房产'].map(c=>`<option${state.assetClass===c?' selected':''}>${c}</option>`).join('')}</select></label><input id="cl-asset-search" class="cl-field cl-search" type="search" aria-label="搜索持仓" placeholder="资产、代码或账户" value="${esc(state.assetSearch)}"></div><button class="cl-button" data-action="export">导出 CSV</button></div><div id="cl-holdings-table">${holdingTable()}</div><div class="cl-foot"><button class="cl-textbutton" data-action="fund">在途资金 ${money(8000)} · 2笔待确认 ›</button></div>`:state.assetView==='composition'?`<section class="cl-panel"><div class="cl-sectionhead"><h2>可投资资产配置</h2><small>含在途 · 按当前市值</small></div><div class="cl-minirows">${[['现金',500000],['ETF',400000],['股票基金',450000],['债券基金',350000],['黄金',152000],['在途',8000]].map(([n,v])=>`<div><span>${n}</span><span class="cl-number">${money(v)}　${(v/1860000*100).toFixed(1)}%</span></div>`).join('')}</div><p class="cl-muted cl-small">房产不计入可投资资产配置。</p></section>`:`<section class="cl-panel"><div class="cl-sectionhead"><h2>账户与负债</h2><small>人民币折算</small></div><div class="cl-minirows">${[['银行账户',500000],['证券账户',400000],['基金账户',808000],['黄金账户',152000],['家庭房产',3140000]].map(([n,v])=>`<div><span>${n}</span><span class="cl-number">${money(v)}</span></div>`).join('')}<div><span>房贷余额</span><span class="cl-number">${money(720000)}</span></div></div></section>`}`}
  function invest(){return `${heading('投资',false)}<div class="cl-domaintabs"><button aria-pressed="true">今日</button><button data-action="return-history">收益历史</button></div><section class="cl-panel cl-performance"><div class="cl-sectionhead"><div><span class="cl-label">当日盈亏</span><div class="cl-value cl-up cl-number">${money(1286.32,true)}</div></div><span class="cl-badge cl-warning">实时估算 · 行情覆盖 96.4%</span></div><div class="cl-foot" style="margin-bottom:16px"><span>北京归属日 2026.11.26 · 可投资组合</span><span>更新于 15:02</span></div>${chart('daily')}</section><section class="cl-panel"><div class="cl-sectionhead"><h2>持仓贡献</h2><small>元</small></div><div class="cl-minirows">${holdings.filter(h=>h.daily!==null).sort((a,b)=>b.daily-a.daily).map(h=>`<div><button class="cl-textbutton" data-asset="${h.id}">${h.name}</button><span class="cl-number ${tone(h.daily)}">${money(h.daily,true)}</span></div>`).join('')}</div><p class="cl-small cl-muted">盘中金额为估算，历史收益按所属日期回看。</p></section>`}
  function recordTable(){const rows=state.transactions.filter(t=>(state.recordType==='全部'||t.type===state.recordType)&&(`${t.asset} ${t.account}`).includes(state.recordSearch));return `<div class="cl-tablewrap"><table aria-label="交易流水"><thead><tr><th>日期</th><th>类型</th><th>资产 / 账户</th><th class="cl-alignright">金额（元）</th><th>状态</th></tr></thead><tbody>${rows.length?rows.map((t,i)=>`<tr><td class="cl-number">${t.date}</td><td>${t.type}</td><td class="cl-assetname">${esc(t.asset)}<small>${t.account}</small></td><td class="cl-number cl-alignright">${money(t.amount)}</td><td><span class="cl-badge ${t.status==='份额待确认'?'cl-warning':''}">${t.status}</span></td></tr>`).join(''):'<tr><td colspan="5" class="cl-empty">没有匹配的流水</td></tr>'}</tbody></table></div><div class="cl-foot"><span>共 ${rows.length} 笔 · 演示记录</span><span>流水金额不等于组合净投入</span></div>`}
  function records(){return `${heading('交易流水')}<div class="cl-domaintabs"><button aria-pressed="true">交易流水</button><button data-action="plans">定投核对</button><button data-action="cash-calendar">资金日历</button><button data-action="imports">导入记录</button></div><div class="cl-toolbar"><div class="cl-actions"><select id="cl-record-type" class="cl-field" aria-label="流水类型">${['全部','买入','卖出','转入','分红'].map(t=>`<option${state.recordType===t?' selected':''}>${t}</option>`).join('')}</select><input id="cl-record-search" class="cl-field cl-search" type="search" aria-label="搜索流水" placeholder="搜索资产或账户" value="${esc(state.recordSearch)}"></div><span class="cl-muted cl-small">2026年11月</span></div><div id="cl-record-table">${recordTable()}</div>`}
  function review(){const p=periods[state.period];const step=state.reviewStep;return `${heading('组合复盘',false)}<div class="cl-sectionhead"><span class="cl-muted">${p.range} · 可投资组合</span>${segments()}</div><div class="cl-steps" aria-label="复盘步骤">${['结果','归因','风险','笔记'].map((n,i)=>`<button data-review-step="${i}" aria-pressed="${step===i}">${i+1}　${n}</button>`).join('')}</div><div class="cl-reviewcontent">${step===0?performance(false):step===1?`<section class="cl-panel"><div class="cl-sectionhead"><h2>收益贡献</h2><small>本月演示</small></div><div class="cl-minirows">${[['沪深300ETF',8500],['黄金积存',3500],['中短债基金',1000],['全球股票指数基金',-3000]].map(([n,v])=>`<div><span>${n}</span><span class="cl-number ${tone(v)}">${money(v,true)}</span></div>`).join('')}</div><p class="cl-small cl-muted">合计投资收益 ${money(10000)}。${state.period!=='month'?'此明细为本月演示，其他周期待细化。':''}</p></section>`:step===2?`<section class="cl-panel"><div class="cl-sectionhead"><h2>风险与数据状态</h2></div><div class="cl-minirows"><div><span>可投资资产估值覆盖</span><span>98.6%</span></div><div><span>待更新估值</span><button class="cl-textbutton" data-action="health">1项 ›</button></div><div><span>基金申购在途</span><span class="cl-number">${money(8000)}</span></div><div><span>最大单项可投资资产</span><span>现金 · 26.9%</span></div></div></section>`:`<section class="cl-panel"><div class="cl-notegrid">${['已确认事实','我的判断','下期验证'].map((n,i)=>`<label>${n}<textarea class="cl-field" data-note="${i}" placeholder="填写${n}">${esc(state.reviewNotes[i])}</textarea></label>`).join('')}<div class="cl-actions"><button class="cl-button cl-primary" data-action="save-notes">保存草稿</button><small class="cl-muted">仅保留在此设计预览中</small></div></div></section>`}</div>`}

      ['从视觉图变成可操作的设计稿','前稿：仅能比较静态图片。','此稿：六页导航、周期、筛选、排序、明细、演示录入与核对、主题和字体可操作。'],
    ].map(([t,old,n],i)=>`<div class="cl-change"><span class="cl-muted">${i+1}</span><div><h3>${t}</h3><div class="cl-old">${old}</div><p>${n}</p></div></div>`).join('')}<p>这是设计评审原型。数据为虚构样本，录入、确认和保存只演示交互，不写入正式账本。</p>`,{wide:true}),
    fonts:()=>{openDialog('字体对比',`<p>同样的字号与字重，比较中文、英文和金额；点击“应用”可切换整页。B / C 的苹方依赖 Apple 设备，其他设备会回退至 Noto Sans SC。</p><div id="cl-font-status" class="cl-foot" role="status">正在检查字体载入…</div>${Object.entries(fonts).map(([key,f])=>`<div class="cl-fontrow"><div><h3>${key} · ${f.name}</h3><small>${f.sub}</small></div><div class="cl-fontsample" style="font-family:${f.css.replaceAll('"',"'")}"><div>Compound Life · 净资产</div><strong class="cl-number">¥1,860,000.00</strong><small>投资收益 +¥10,000.00　−0.55%</small></div><button class="cl-button" data-font-choice="${key}" aria-pressed="${state.font===key}">${state.font===key?'已应用':'应用'}</button></div>`).join('')}<div class="cl-dialogfooter"><button class="cl-button cl-primary" data-action="close">返回页面</button></div>`,{wide:true,kind:'fonts'});Promise.all(['Inter','Geist','Noto Sans SC'].map(f=>document.fonts.load(`400 16px "${f}"`))).then(v=>{const el=root.querySelector('#cl-font-status');if(el)el.textContent=v.every(x=>x.length)?'Inter / Geist / Noto Sans SC 已载入；A 为当前设备系统字体。':'部分字体未载入，当前可能显示回退字体。'}).catch(()=>{const el=root.querySelector('#cl-font-status');if(el)el.textContent='字体载入失败，当前为系统回退字体。'})},
    entry:()=>openDialog('录入流水',`<p>按已发生的交易记录。本稿新增记录仅用于交互演示。</p><form id="cl-entry-form" style="margin-top:20px"><div class="cl-formgrid"><label>交易类型<select name="type" class="cl-field"><option>买入</option><option>卖出</option><option>分红</option><option>转入</option></select></label><label>日期<input class="cl-field" name="date" type="date" value="2026-11-26" max="2026-11-26" required></label><label class="cl-full">资产<select class="cl-field" name="asset">${holdings.filter(h=>h.cls!=='房产').map(h=>`<option value="${h.id}"${h.id==='etf'?' selected':''}>${h.name}</option>`).join('')}</select></label><label>金额（元）<input class="cl-field" name="amount" type="number" min=".01" step=".01" placeholder="0.00" required></label><label>费用（元）<input class="cl-field" name="fee" type="number" min="0" step=".01" value="0" required></label></div><div class="cl-error" id="cl-entry-error" role="alert"></div><div class="cl-dialogfooter"><button type="button" class="cl-button" data-action="close">取消</button><button class="cl-button cl-primary" type="submit">保存演示记录</button></div></form>`,{kind:'entry'}),
    fund:()=>openDialog('基金份额确认',`<div class="cl-minirows"><div><span>全球股票指数基金</span><span class="cl-number">¥5,000.00</span></div><div><span>中短债基金</span><span class="cl-number">¥3,000.00</span></div></div><p>先核对平台确认的净值与份额，再确认。以下体验第一笔的核对流程。</p><form id="cl-fund-form" style="margin-top:16px"><div class="cl-formgrid"><label>成交净值<input name="nav" class="cl-field" type="number" min=".0001" step=".0001" value="2.5000" required></label><label>平台确认份额<input name="shares" class="cl-field" type="number" min=".01" step=".01" value="2000.00" required></label></div><div class="cl-error" id="cl-fund-error" role="alert"></div><div class="cl-dialogfooter"><button type="button" class="cl-button" data-action="close">取消</button><button type="submit" class="cl-button cl-primary">体验确认</button></div></form>`,{kind:'fund'}),
    plans:()=>openDialog('定投核对',`<p>到期未记录的计划需要核对，不能直接认定为未执行。</p><div class="cl-minirows">${['11.23 全球股票指数基金','11.24 中短债基金','11.25 全球股票指数基金'].map((n,i)=>`<div><span>${n}</span><select class="cl-field" aria-label="${n}执行结果"><option>待核对</option><option>已买入</option><option>未买入</option></select></div>`).join('')}</div><div class="cl-dialogfooter"><button class="cl-button" data-action="close">取消</button><button class="cl-button cl-primary" data-action="plan-confirm">体验保存</button></div>`),
    'plan-confirm':()=>{const values=[...dialog.querySelectorAll('select')].map(s=>s.value);if(values.every(v=>v==='待核对')){notify('请先选择至少一项执行结果');return}closeDialog();notify('已演示核对流程，计划与正式账本未变')},
    reconcile:()=>openDialog('账户对账',`<p>比较同一日期的账本金额与平台凭证。</p><div class="cl-minirows"><div><span>账户</span><span>银行账户</span></div><div><span>对账日期</span><span>2026.11.26</span></div><div><span>账本金额</span><span class="cl-number">${money(500000)}</span></div></div><label style="display:grid;gap:8px">平台金额（元）<input class="cl-field" id="cl-reconcile-value" type="number" value="500000" step=".01"></label><div class="cl-dialogfooter"><button class="cl-button" data-action="close">返回</button><button class="cl-button cl-primary" data-action="reconcile-check">比较差额</button></div>`),
    'reconcile-check':()=>{const v=Number(dialog.querySelector('#cl-reconcile-value').value);notify(Number.isFinite(v)?`与账本差额 ${money(v-500000,true)}`:'请输入有效金额')},
    health:()=>openDialog('估值状态',`<p>可投资资产估值覆盖 98.6%，仍有1项待更新。覆盖范围不包含房产。</p><div class="cl-minirows"><div><span>中短债基金</span><span class="cl-badge cl-warning">待更新</span></div><div><span>最新估值日</span><span>2026.11.25</span></div><div><span>估值来源</span><span>官方净值</span></div><div><span>在途资金</span><span class="cl-number">${money(8000)}</span></div></div><p>更新后才撤下状态提示，不用按钮点击时间替代估值日期。</p><div class="cl-dialogfooter"><button class="cl-button" data-action="close">返回</button><button class="cl-button" data-action="mock-refresh">体验更新失败</button></div>`),
    'mock-refresh':()=>notify('暂未取得新净值，保留原值与待更新状态'),
    liabilities:()=>{state.page='assets';state.assetView='accounts';render()},
    settings:()=>openDialog('显示设置',`<div class="cl-minirows"><div><span>字体</span><button class="cl-button" data-action="fonts">选择字体</button></div><div><span>主题</span><button class="cl-button" data-action="theme">切换浅色 / 深色</button></div></div><p>当前用户：所有者。正式应用的成员与权限流程不在此处改动。</p>`),
    theme:()=>{root.dataset.theme=root.dataset.theme==='light'?'dark':'light';root.querySelector('[aria-label^="切换"]').setAttribute('aria-label',root.dataset.theme==='light'?'切换深色主题':'切换浅色主题');root.querySelector('[aria-label^="切换"]').textContent=root.dataset.theme==='light'?'深色':'浅色';persist()},
    search:()=>openDialog('前往页面',`<input id="cl-page-search" class="cl-field" style="width:100%;margin-bottom:16px" type="search" aria-label="搜索页面" placeholder="总览、持仓、流水、复盘…"><div id="cl-page-results">${Object.entries(pageNames).map(([key,n])=>`<button class="cl-task" data-page="${key}"><span>${n}</span><span>进入 ›</span></button>`).join('')}</div>`,{kind:'search'}),
    'return-history':()=>openDialog('收益历史',`${performance()}<p>历史收益按所选区间计算；不将当前持仓盈亏当作历史投资收益。</p>`,{wide:true}),
    'cash-calendar':()=>openDialog('资金日历',`<div class="cl-minirows"><div><span>11.24 实际买入</span><span class="cl-number">${money(12000)}</span></div><div><span>11.25 实际买入</span><span class="cl-number">${money(5000)}</span></div></div><p>此视图仅展示账本实际活动，不把定投计划混入实际投入。</p>`),
    imports:()=>openDialog('导入记录',`<p>CSV 导入先预览、核对重复和异常，再明确确认入账。本稿保留该流程入口，文件上传与正式入账将在实施时接入。</p>`),
    'save-notes':()=>{persist();notify('草稿已保留在本次演示中')},
    'clear-assets':()=>{state.assetClass='全部';state.assetSearch='';render()},
    export:()=>{const rows=[['资产','代码','账户','币种','市值','未实现盈亏','估值来源','估值日期'],...assetRows().map(h=>[h.name,h.symbol,h.account,'CNY',h.value.toFixed(2),(h.value-h.cost).toFixed(2),h.source,'2026.'+h.date])];const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='compound-life-demo-holdings.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已导出筛选后的演示持仓，不含在途资金')},
    reset:()=>{state.period='month';state.assetClass='全部';state.assetSearch='';state.sort='value';state.sortDir=-1;state.recordType='全部';state.recordSearch='';state.reviewStep=0;state.assetView='holdings';state.reviewNotes=['','',''];state.transactions=initialTransactions.map(x=>({...x}));state.monthly=2000;state.rate=4;state.target=3000000;state.page='overview';closeDialog();render();notify('已恢复初始演示数据')},
  }
  root.addEventListener('click',event=>{
    const b=event.target.closest('button');if(!b||!root.contains(b))return
    if(b.dataset.page){closeDialog();state.page=b.dataset.page;render();persist();return}
    if(b.dataset.period){state.period=b.dataset.period;if(dialogKind==='info'&&!overlay.hidden){actions['return-history']()}else render();return}
    if(b.dataset.assetView){state.assetView=b.dataset.assetView;render();return}
    if(b.dataset.asset){assetDialog(b.dataset.asset);return}
    if(b.dataset.sort){if(state.sort===b.dataset.sort)state.sortDir*=-1;else{state.sort=b.dataset.sort;state.sortDir=b.dataset.sort==='name'?1:-1}root.querySelector('#cl-holdings-table').innerHTML=holdingTable();return}
    if(b.dataset.reviewStep){state.reviewStep=Number(b.dataset.reviewStep);render();return}
    if(b.dataset.fontChoice){state.font=b.dataset.fontChoice;applyFont();return}
    if(b.dataset.info){const info={networth:['净资产','全部资产减全部负债，包含房产和长期资产。'],investable:['可投资资产','现金、基金、ETF、股票、黄金及在途资金。不含房产和长期持股。'],flow:['净投入','所选区间内组合外部资金流入减流出，不含内部买卖和结算。'],holdings:['持仓总市值','当前持仓市值合计。此视图包含房产，不含在途资金；与可投资资产的范围不同。']}[b.dataset.info];openDialog(info[0],`<p>${info[1]}</p>`);return}
    if(b.dataset.action==='asset-records'){const h=holdings.find(x=>x.id===b.dataset.id);closeDialog();state.page='records';state.recordSearch=h.name;render();return}
    if(b.dataset.action)actions[b.dataset.action]?.()
  })
  root.addEventListener('input',event=>{
    const el=event.target
    if(el.id==='cl-asset-search'){state.assetSearch=el.value;root.querySelector('#cl-holdings-table').innerHTML=holdingTable()}
    if(el.id==='cl-record-search'){state.recordSearch=el.value;root.querySelector('#cl-record-table').innerHTML=recordTable()}
    if(el.id==='cl-page-search'){const q=el.value.trim();root.querySelector('#cl-page-results').innerHTML=Object.entries(pageNames).filter(([k,n])=>(n+({assets:'持仓账户配置',records:'交易流水定投',invest:'看盘行情收益'}[k]||'')).includes(q)).map(([k,n])=>`<button class="cl-task" data-page="${k}"><span>${n}</span><span>进入 ›</span></button>`).join('')||'<div class="cl-empty">没有匹配的页面</div>'}
    if(el.dataset.note!==undefined)state.reviewNotes[Number(el.dataset.note)]=el.value
    const goalFields={'cl-goal-target':'target','cl-goal-monthly':'monthly','cl-goal-rate':'rate'}
    if(goalFields[el.id]){if(!el.value||!el.validity.valid){el.setAttribute('aria-invalid','true');return}el.removeAttribute('aria-invalid');state[goalFields[el.id]]=Number(el.value);root.querySelector('#cl-goal-result').innerHTML=goalNumbers()}
  })
  root.addEventListener('change',event=>{
    const el=event.target
    if(el.id==='cl-asset-class'){state.assetClass=el.value;root.querySelector('#cl-holdings-table').innerHTML=holdingTable()}
    if(el.id==='cl-record-type'){state.recordType=el.value;root.querySelector('#cl-record-table').innerHTML=recordTable()}
  })
  root.addEventListener('submit',event=>{
    event.preventDefault();const form=event.target
    if(form.id==='cl-entry-form'){
      const amount=Number(form.elements.amount.value),fee=Number(form.elements.fee.value)
      if(!Number.isFinite(amount)||amount<=0||!Number.isFinite(fee)||fee<0){root.querySelector('#cl-entry-error').textContent='请输入有效金额，费用不能为负数。';return}
      const h=holdings.find(x=>x.id===form.elements.asset.value)
      if(h.cls==='现金'&&['买入','卖出','分红'].includes(form.elements.type.value)){root.querySelector('#cl-entry-error').textContent='现金不能录为买卖或分红，请选择交易资产。';return}
      if(h.cls!=='现金'&&form.elements.type.value==='转入'){root.querySelector('#cl-entry-error').textContent='此演示的转入用于现金，请选择人民币现金。';return}
      state.transactions.unshift({date:form.elements.date.value,type:form.elements.type.value,asset:h.name,account:h.account,amount,status:'演示录入'})
      closeDialog();state.page='records';state.recordType='全部';state.recordSearch='';render();notify('已加入本页演示记录，资产汇总未变')
    }
    if(form.id==='cl-fund-form'){
      const nav=Number(form.elements.nav.value),shares=Number(form.elements.shares.value)
      if(!Number.isFinite(nav)||!Number.isFinite(shares)||nav<=0||shares<=0||Math.abs(nav*shares-5000)>.02){root.querySelector('#cl-fund-error').textContent='份额与金额不匹配，请核对平台净值和确认份额。';return}
      closeDialog();notify('已完成确认流程演示，未写入正式账本')
    }
  })
  root.addEventListener('keydown',event=>{
    if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();actions.search();return}
    if(overlay.hidden)return
    if(event.key==='Escape'){event.preventDefault();closeDialog()}
    if(event.key==='Tab'){const list=[...dialog.querySelectorAll('button:not([disabled]),input,select,textarea,a[href]')].filter(el=>!el.hidden);if(!list.length)return;const first=list[0],last=list.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}
  })
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeDialog()})
  const saved=window.openai?.widgetState
  if(saved?.modelContent?.font&&fonts[saved.modelContent.font])state.font=saved.modelContent.font
  if(saved?.privateContent?.theme)root.dataset.theme=saved.privateContent.theme
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState;if(saved?.modelContent?.font&&fonts[saved.modelContent.font]){state.font=saved.modelContent.font;applyFont(false)}})
  render()
})()
</script>

</body></html>
